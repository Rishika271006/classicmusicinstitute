<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="logoGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B28020"/>
      <stop offset="100%" stop-color="#7B5410"/>
    </linearGradient>
    <linearGradient id="emblemBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Emblem -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="url(#emblemBgLight)"/>
    <rect x="1" y="1" width="56" height="56" rx="13" fill="none" stroke="url(#logoGoldLight)" stroke-width="1.2" stroke-opacity="0.9"/>
    
    <g transform="translate(29, 29) scale(0.85)">
      <path d="M-15,-7 C-16,5 -9,15 0,18 C9,15 16,5 15,-7 C17,-13 11,-18 7,-15 C5,-13 7,-8 6,-4 C-2,13 -9,13 -14,-6 C-15,-9 -18,-10 -15,-7 Z" fill="url(#logoGoldLight)" />
      <path d="M-1,-18 C0,-18 1,-17 1,-15 C1,-11 -2,-6 -2,-2 C-2,2 2,4 4,1 C6,-2 4,-6 0,-7 C-5,-8 -7,-3 -6,2 C-5,8 1,11 3,11 C6,11 8,9 8,6 C8,3 5,1 2,3 C1,4 2,6 3,5 C4,4 3,3 2,3 C-1,3 -2,-1 -1,-5 C0,-9 2,-12 2,-15 C2,-17 1,-18 -1,-18 Z" fill="url(#logoGoldLight)" />
      <circle cx="0" cy="8.5" r="2.5" fill="url(#logoGoldLight)"/>
      <circle cx="-5" cy="-3" r="1.5" fill="#FCE38A"/>
      <circle cx="5" cy="-3" r="1.5" fill="#FCE38A"/>
    </g>
  </g>

  <!-- Typography: CLASSIC MUSIC INSTITUTE (White text for dark backgrounds) -->
  <g transform="translate(80, 16)">
    <text x="0" y="22" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="23" font-weight="800" letter-spacing="3" fill="#FFFFFF">
      CLASSIC
    </text>
    <text x="135" y="22" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="23" font-weight="800" letter-spacing="3" fill="url(#logoGoldLight)">
      .
    </text>
    
    <text x="1" y="38" font-family="'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4" fill="#D4AF37">
      MUSIC INSTITUTE
    </text>
    
    <text x="2" y="49" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" letter-spacing="2.2" fill="#94A3B8">
      ACADEMY OF FINE ARTS • CHANDIGARH
    </text>
  </g>
</svg>
