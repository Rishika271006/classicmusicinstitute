<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#7B5410"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Treble Clef & Lyre Symbolism in Gold -->
  <g transform="translate(32, 32) scale(0.95)" filter="url(#glow)">
    <!-- Lyre/Harp Strings & Frame -->
    <path d="M-15,-8 C-16,4 -10,15 0,18 C10,15 16,4 15,-8 C17,-14 11,-19 7,-16 C5,-14 7,-9 6,-5 C-2,14 -10,14 -14,-7 C-15,-10 -18,-11 -15,-8 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Stylized Treble Clef Core -->
    <path d="M-1,-20 C0,-20 1,-19 1,-17 C1,-12 -2,-7 -2,-3 C-2,2 2,4 4,1 C6,-2 4,-7 0,-8 C-5,-9 -7,-4 -6,1 C-5,8 1,11 3,11 C6,11 8,9 8,6 C8,3 5,1 2,3 C1,4 2,6 3,5 C4,4 3,3 2,3 C-1,3 -2,-1 -1,-6 C0,-10 2,-14 2,-17 C2,-19 1,-20 -1,-20 Z" 
          fill="url(#goldGrad)" />
          
    <!-- Musical Note Accents -->
    <circle cx="0" cy="9" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="-6" cy="-4" r="1.6" fill="#FDE08B"/>
    <circle cx="6" cy="-4" r="1.6" fill="#FDE08B"/>
  </g>
</svg>
